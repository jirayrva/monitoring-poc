# Exceptions to the OpenAPI lint rules, one location at a time.
monitor-api/openapi.json:
  # These take no input and have no failure the client causes, so they have no 4XX response.
  operation-4xx-response:
    - '#/paths/~1v1~1devices/get/responses'
    - '#/paths/~1v1~1device-statuses/get/responses'
    - '#/paths/~1v1~1monitoring/get/responses'
    - '#/paths/~1v1~1monitoring~1start/post/responses'
    - '#/paths/~1v1~1monitoring~1stop/post/responses'
    - '#/paths/~1livez/get/responses'
