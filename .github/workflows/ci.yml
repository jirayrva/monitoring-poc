name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm deps:up
      - run: pnpm test:integration
