# The whole stack, with simulated devices: `docker compose up`, then the dashboard on http://127.0.0.1:8080. For
# development, `pnpm deps:up` starts only what the service needs, and `pnpm dev` runs the service itself.

# Names the containers, network and volume device-monitor-*, whatever the checkout's folder is called.
name: device-monitor

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      # Only on loopback, because the password above is not a secret.
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - device-monitor
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=monitor --dbname=monitor']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  monitor:
    build:
      context: .
      target: monitor
    # Reaps any process the checksum binary leaves behind, and passes signals on to Node.
    init: true
    # Back after the stand's machine restarts (I-08).
    restart: unless-stopped
    environment:
      DATASTORE_CONNECTION_STRING: postgres://monitor:monitor@postgres:5432/monitor
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The demo camera's token. It opens nothing real.
      DEVICE_DEMO_TOKEN: demo-token
      # From the shell, to see how rounds of the fleet shorten as it rises.
      MONITORING_MAX_CONCURRENT_PROBES: ${MONITORING_MAX_CONCURRENT_PROBES:-250}
    env_file:
      # Device tokens, as DEVICE_<NAME>=<token> lines, kept out of this file.
      - path: .env.devices
        required: false
      # The checksum binary's settings, beside it in vendor/, which Git ignores: CHECKSUM_BINARY_PATH under
      # /opt/vendor, its algorithms, arguments and environment. Without it, the stand-in makes the checksums.
      - path: vendor/checksum.env
        required: false
    volumes:
      - type: bind
        source: ./vendor
        target: /opt/vendor
        read_only: true
    # Reached through the gateway, not published.
    networks:
      - device-monitor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Node, as the image has no curl. /livez never asks the database.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  simulator:
    build:
      context: .
      target: simulator
    init: true
    restart: unless-stopped
    environment:
      SIMULATOR_DEVICE_PORT: ${SIMULATOR_DEVICE_PORT:-4100}
      SIMULATOR_CONTROL_PORT: ${SIMULATOR_CONTROL_PORT:-4101}
      # Starts with the demo devices, and registers them with the monitor. One already registered is left as it is,
      # so a restart does not undo changes made through the monitor's API.
      SIMULATOR_DEVICES_FILE: demo-devices.json
      SIMULATOR_MONITOR_URL: http://monitor:3000
      SIMULATOR_DEVICE_BASE_URL: http://simulator:${SIMULATOR_DEVICE_PORT:-4100}/devices
    ports:
      # The same port inside and out: a device names the port it answers on, which must work from both.
      - 127.0.0.1:${SIMULATOR_DEVICE_PORT:-4100}:${SIMULATOR_DEVICE_PORT:-4100}
      # The control API, to add devices and change how they answer. Never given to the monitor.
      - 127.0.0.1:${SIMULATOR_CONTROL_PORT:-4101}:${SIMULATOR_CONTROL_PORT:-4101}
    networks:
      - device-monitor
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:${SIMULATOR_CONTROL_PORT:-4101}/devices').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      monitor:
        condition: service_healthy

  # The dashboard, the monitor's API and the simulator's control API, on one origin and one port (D-66).
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      SIMULATOR_CONTROL_PORT: ${SIMULATOR_CONTROL_PORT:-4101}
    ports:
      # 8080, so it does not clash with `pnpm dev` on 3000.
      - 127.0.0.1:${GATEWAY_PORT:-8080}:8080
    networks:
      - device-monitor
    depends_on:
      monitor:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/livez']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:

# Named rather than Compose's default, so every service joins it explicitly. Compose prefixes it with
# the project name, so a stack under another project, such as the end-to-end tests', gets its own.
networks:
  device-monitor:
